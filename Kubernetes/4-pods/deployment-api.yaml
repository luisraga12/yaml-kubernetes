# API Laravel, 2 replicas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auratech-api
  namespace: pruebas
  labels:
    app: auratech-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auratech-api
  template:
    metadata:
      labels:
        app: auratech-api
    spec:
      containers:
        - name: api
          image: luisantoniorr/auratech-api:1.1
          ports:
            - containerPort: 80
          env:
            - name: APP_NAME
              value: "AuraTech"
            - name: APP_ENV
              valueFrom:
                secretKeyRef:
                  name: auratech-secret
                  key: APP_ENV
            - name: APP_DEBUG
              valueFrom:
                secretKeyRef:
                  name: auratech-secret
                  key: APP_DEBUG
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: auratech-secret
                  key: APP_KEY
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: auratech-secret
                  key: DB_HOST
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: auratech-secret
                  key: DB_DATABASE
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auratech-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auratech-secret
                  key: DB_PASSWORD
            - name: SESSION_DRIVER
              valueFrom:
                secretKeyRef:
                  name: auratech-secret
                  key: SESSION_DRIVER
            - name: CACHE_STORE
              valueFrom:
                secretKeyRef:
                  name: auratech-secret
                  key: CACHE_STORE
            - name: QUEUE_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: auratech-secret
                  key: QUEUE_CONNECTION
          volumeMounts:
            - name: auratech-storage
              mountPath: /var/www/html/storage/app/public
          startupProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: auratech-storage
          hostPath:
            path: /data/pruebas/auratech-storage
            type: DirectoryOrCreate