apiVersion: apps/v1
kind: Deployment
metadata:
  name: auratech-tienda
  namespace: pruebas
  labels:
    app: auratech-tienda
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auratech-tienda
  template:
    metadata:
      labels:
        app: auratech-tienda
    spec:
      containers:
        - name: frontend
          image: luisantoniorr/auratech-frontend:1.1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
